# Deploy to production on a green CI run on main.
#
# Credentials: the job assumes the deploy role via GitHub OIDC
# (scripts/setup-github-oidc.sh). No long-lived AWS keys exist anywhere.
#
# Required repo secrets — the deploy FAILS LOUDLY without them, by design:
#   CLOUDFLARE_API_TOKEN   "Edit zone DNS" template, scoped to marinopavers.com
#   CLOUDFLARE_ZONE_ID     the zone's id
# and the repo VARIABLES:
#   AWS_DEPLOY_ROLE_ARN    written by scripts/setup-github-oidc.sh
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id (not secret)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time. Overlapping merges QUEUE rather than cancel: killing
  # `sst deploy` mid-flight abandons the Pulumi state lock.
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-1

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx sst deploy --stage production

      - name: Smoke check
        # Runs right after the deploy, while the new CloudFront function and
        # routes are still propagating: a path that is new to the
        # distribution can answer 404 for a minute or two first, so each
        # check retries before it fails.
        #
        # The manifest only exists once a photo has been processed (or an
        # empty one was seeded). Before that, S3 answers 403 for the missing
        # key — CloudFront has no ListBucket on the media bucket, so it can't
        # say 404 — and that is a healthy fresh stage, not a broken route.
        run: |
          site="https://marinopavers.com"
          expect() { # expect <status regex> <path>
            for attempt in $(seq 1 12); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "${site}$2")"
              if [[ "$code" =~ ^($1)$ ]]; then echo "${code} $2"; return 0; fi
              sleep 10
            done
            echo "::error::$2 answered ${code}, wanted $1"
            return 1
          }
          for route in / /services /gallery /es /es/services /es/gallery; do
            expect 200 "$route"
          done
          expect '200|403|404' /media/manifest.json
          # A missing URL answers 404 (not 403 or 502), whichever language prefix.
          expect 404 /nada
          expect 404 /es/nada
          # Retired URLs redirect at the edge (infra/redirects.ts).
          for pair in "/about /" "/contact /" "/our-work /gallery"; do
            set -- $pair
            expect 301 "$1"
            target="$(curl -s -o /dev/null -w '%{redirect_url}' "${site}$1")"
            echo "  -> ${target}"
            [ "$target" = "${site}$2" ] || { echo "::error::$1 redirects to ${target}"; exit 1; }
          done
